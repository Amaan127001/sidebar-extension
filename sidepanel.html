<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Extractor</title>
  <style>
    /* CRITICAL: Disable all resize capabilities */
    html, body {
      width: 800px !important;
      min-width: 800px !important;
      max-width: 800px !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
      resize: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
    }

    #root {
      width: 800px !important;
      min-width: 800px !important;
      max-width: 800px !important;
      height: 100vh !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
      resize: none !important;
    }

    /* Hide any potential resize handles */
    ::-webkit-resizer {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* Disable text selection and dragging */
    * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-user-drag: none !important;
      -khtml-user-drag: none !important;
      -moz-user-drag: none !important;
      -o-user-drag: none !important;
      resize: none !important;
    }

    /* Allow text selection only where needed */
    input, textarea, [contenteditable="true"] {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }

    /* Loading state */
    .side-panel-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 800px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #666;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .app-loaded .side-panel-loading {
      display: none;
    }

    /* Override any external styles */
    html[style*="width"] {
      width: 800px !important;
    }
    
    body[style*="width"] {
      width: 800px !important;
    }
    
    #root[style*="width"] {
      width: 800px !important;
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Loading state while React initializes -->
    <div class="side-panel-loading">
      <div>
        <div style="text-align: center;">
          <div style="margin-bottom: 8px; font-size: 2rem;">⚡</div>
          <div>Loading LinkedIn Extractor...</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/enforceWidth.js"></script>

  
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
